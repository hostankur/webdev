<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .container {
        height: 400px;
        width: 500px;
        border: 2px solid black;
        position: relative;

       

        .top-left{
            position: absolute;
            top: 0%;
            left: 0%;


        }
        .top-right{
            top: 0%;
            right: 0%;
            position: absolute;
        }
        .bottom-left{
            position: absolute;
            bottom: 0%;
            left: 0%;
        }
        .bottom-right{
            position: absolute;
            bottom: 0%;
            right: 0%;
        }
}
    </style>
</head>
<body>
   
    <div class="container">
        <p class="top-left">Ankur Roy</p>

        <p class="top-right">Ankur Roy</p>
        <p class="bottom-left">Ankur Roy</p>
        <p class="bottom-right">Ankur Roy</p>
  </div>
    </div>
    
</body>
</html>
